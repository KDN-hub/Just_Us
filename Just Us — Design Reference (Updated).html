<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Just Us — Design Reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#141210; --surface:#1E1B18; --card:#26221E;
    --wine:#7A2C3B; --wine-l:#9B3A4C;
    --gold:#C9A66B; --gold-l:#E0BF8A;
    --cream:#F5F0E8; --cream-2:#EDE5D4;
    --muted:#8A8177; --border:#3A342E;
    --ink:#1A1614;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--cream);font-family:'DM Sans',sans-serif;min-height:100vh;}
  .page{padding:56px 24px 80px;max-width:1280px;margin:0 auto;}
  header{text-align:center;padding-bottom:52px;}
  header .eyebrow{color:var(--gold);font-size:12px;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:10px;}
  header h1{font-family:'Fraunces',serif;font-size:36px;font-weight:500;line-height:1.2;margin-bottom:8px;}
  header p{color:var(--muted);font-size:14px;line-height:1.7;max-width:440px;margin:0 auto;}
  .gallery{display:flex;flex-wrap:wrap;gap:40px;justify-content:center;}
  figure{display:flex;flex-direction:column;align-items:center;gap:14px;}
  figcaption{text-align:center;}
  .num{color:var(--gold);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:2px;}
  .label{font-size:13px;font-weight:500;color:var(--cream);}
  /* phone shell */
  .phone{width:240px;height:480px;border-radius:36px;background:var(--surface);padding:9px;box-shadow:0 24px 56px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.06);}
  .screen{width:100%;height:100%;border-radius:28px;overflow:hidden;position:relative;display:flex;flex-direction:column;}

  /* ── WELCOME ─────────────────────────────────── */
  .s-welcome{background:linear-gradient(160deg,#1A1210 0%,#3B1520 55%,#5C1E2D 100%);align-items:center;justify-content:center;text-align:center;gap:16px;padding:28px 20px;}
  .w-photo{width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid rgba(201,166,107,.35);}
  .w-title{font-family:'Fraunces',serif;font-size:20px;font-weight:400;color:var(--cream);line-height:1.3;}
  .w-sub{font-size:12px;color:var(--muted);line-height:1.6;}
  .btn-w{width:100%;background:var(--wine);color:var(--cream);border:none;border-radius:12px;padding:13px;font-size:13px;font-weight:500;font-family:'DM Sans',sans-serif;}
  .dots{display:flex;gap:5px;justify-content:center;}
  .dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.2);}
  .dot.on{background:var(--gold);}

  /* ── SHEET (onboarding) ───────────────────────── */
  .s-sheet{background:var(--surface);}
  .sheet-top{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#1A1210,#3B1520);padding:16px;gap:8px;}
  .sheet-kicker{color:var(--gold);font-size:10px;letter-spacing:.08em;text-transform:uppercase;}
  .sheet-big{font-family:'Fraunces',serif;font-size:28px;font-weight:400;color:var(--cream);}
  .sheet-body{background:var(--card);border-radius:22px 22px 0 0;padding:20px 18px 24px;display:flex;flex-direction:column;gap:12px;}
  .sheet-q{font-size:13px;font-weight:500;color:var(--cream);}
  .sheet-hint{font-size:11px;color:var(--muted);line-height:1.5;}
  .field{border:1px solid var(--border);border-radius:10px;padding:10px 13px;font-size:13px;color:var(--cream);background:var(--surface);}
  .btn-s{width:100%;background:var(--wine);color:var(--cream);border:none;border-radius:10px;padding:12px;font-size:13px;font-weight:500;font-family:'DM Sans',sans-serif;}

  /* ── PIN ──────────────────────────────────────── */
  .s-pin{background:var(--surface);}
  .pin-top{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#1A1210,#3B1520);padding:16px;}
  .pin-kicker{color:var(--gold);font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;}
  .pin-day{font-family:'Fraunces',serif;font-size:30px;font-weight:400;color:var(--cream);}
  .pin-body{background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;}
  .avatar-sm{width:38px;height:38px;border-radius:50%;background:var(--wine);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--cream);}
  .pin-label{font-size:12px;color:var(--muted);}
  .pdots{display:flex;gap:11px;}
  .pdot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--border);}
  .pdot.f{background:var(--wine);border-color:var(--wine);}
  .pad{display:grid;grid-template-columns:repeat(3,44px);gap:8px;}
  .key{height:44px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:15px;color:var(--cream);display:flex;align-items:center;justify-content:center;}

  /* ── DATE ─────────────────────────────────────── */
  /* reuse s-sheet + sheet-body */

  /* ── CHAT ─────────────────────────────────────── */
  .s-chat{background:var(--bg);}
  .chat-head{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--surface);}
  .av{width:32px;height:32px;border-radius:50%;background:var(--wine);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--cream);}
  .ch-name{font-size:13px;font-weight:500;color:var(--cream);}
  .ch-status{font-size:10px;color:#4C7A5B;}
  .ic{width:30px;height:30px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;}
  .msgs{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:9px;overflow:hidden;}
  .bubble{max-width:73%;padding:8px 12px;font-size:12px;line-height:1.45;}
  .them{align-self:flex-start;background:var(--card);color:var(--cream);border-radius:12px 12px 12px 3px;}
  .me{align-self:flex-end;background:var(--wine);color:var(--cream);border-radius:12px 12px 3px 12px;}
  .ts{font-size:9px;color:var(--muted);margin-top:2px;}
  .ts.r{text-align:right;}
  .inp{display:flex;align-items:center;gap:7px;padding:9px 11px;border-top:1px solid var(--border);background:var(--surface);}
  .inp input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:8px 12px;font-size:12px;color:var(--cream);}
  .send{width:32px;height:32px;border-radius:50%;background:var(--wine);border:none;display:flex;align-items:center;justify-content:center;}

  /* ── CALL ─────────────────────────────────────── */
  .s-call{background:#0F0D0B;}
  .call-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;}
  .call-av{width:68px;height:68px;border-radius:50%;overflow:hidden;border:2px solid rgba(201,166,107,.3);}
  .call-av img{width:100%;height:100%;object-fit:cover;}
  .call-info{position:absolute;top:18px;text-align:center;left:0;right:0;}
  .call-name{font-size:13px;font-weight:500;color:#EFE9DF;}
  .call-timer{font-size:11px;color:#6B6460;margin-top:2px;}
  .pip{position:absolute;bottom:12px;right:12px;width:58px;height:82px;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.12);}
  .pip img{width:100%;height:100%;object-fit:cover;}
  .controls{display:flex;gap:12px;padding:20px 0 26px;justify-content:center;}
  .ctrl{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.08);border:none;display:flex;align-items:center;justify-content:center;}
  .ctrl.end{width:54px;background:var(--wine);}

  svg{display:block;}
</style>
</head>
<body>
<div class="page">

<header>
  <div class="eyebrow">Design reference · Just Us</div>
  <h1>All screens, one doc</h1>
  <p>Seven screens for the V1 build. Charcoal-dark palette, wine accent, DM Sans for the UI, Fraunces for the emotional beats.</p>
</header>
